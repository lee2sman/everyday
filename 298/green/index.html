<script>

const img=document.body.querySelectorAll("img")


function remix(){
for (let i=0;i<img.length;i++){
img[i].style.left=Math.random()*1000+"px"
img[i].style.top=Math.random()*1000+"px"
img[i].style.width=Math.random()*1000+"px"
img[i].style.transform="rotate("+Math.random()*360+"deg)"
}
}
remix();
document.addEventListener('click',remix)


</script>
